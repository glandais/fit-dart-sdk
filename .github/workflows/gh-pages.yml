name: gh-pages

# Publishes the Flutter web demo in demo/ to GitHub Pages. The demo is
# hand-written and local to this repository; everything under lib/ and test/ is
# generated by fitgen.
#
# Pages must be enabled once, in Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a running build.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # WebAssembly, with the JavaScript fallback Flutter builds alongside it
      # for browsers without WasmGC. --base-href because Pages serves this
      # repository under /fit-dart-sdk/, not at the root of the domain.
      - run: flutter build web --wasm --base-href /fit-dart-sdk/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
